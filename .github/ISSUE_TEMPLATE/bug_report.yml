name: Bug Report
description: Something broke in the export or in the exported game
body:
  - type: markdown
    attributes:
      value: |
        Check the [troubleshooting table](https://github.com/GURecomp/SUYU-GURecomp/blob/main/docs/a32recomp/INSTALL.md#9-troubleshooting) first.
        **Never attach** keys, game files, the exported game exe or its `exefs` folder.
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      description: Please search to see if an issue already exists for the bug you encountered.
      options:
      - label: I have searched the existing issues
        required: true
  - type: input
    attributes:
      label: Release
      description: The release you used (from the zip's name), or the commit if you built from source.
      placeholder: 0.1.0-test
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Where did it happen?
      options:
        - Exporting the game
        - Starting the exported game
        - Playing (town, quest, menus)
        - Multiplayer
        - Mods / Forge PC
        - Other
    validations:
      required: true
  - type: textarea
    id: issue-desc
    attributes:
      label: Description of Issue
      description: What happened, with screenshots or video if you can.
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Reproduction Steps
      description: What you did, and where in the game (town, quest name, menu).
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Logs
      description: |
        Drag in `user\log\suyu_log.txt` and `user\recomp_report.txt` from the export folder, or for export problems the export log text from suyu's window. These files show your folder paths; edit them out if you like.
    validations:
      required: true
  - type: textarea
    id: system-config
    attributes:
      label: System Configuration
      placeholder: |
        CPU: AMD Ryzen 5 3600
        GPU/Driver: NVIDIA GeForce RTX 3060 (Driver 560.94)
        RAM: 16GB
        OS: Windows 11 24H2
        Visual Studio: 17.14
      value: |
        CPU:
        GPU/Driver:
        RAM:
        OS:
        Visual Studio:
    validations:
      required: true
